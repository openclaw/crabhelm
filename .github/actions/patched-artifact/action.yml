name: Patched artifact transport for finite Crabhelm qualification
description: Official pinned artifact bundles on immutable patched Node24; no product execution
inputs:
  operation:
    required: true
    description: upload or download
  name:
    description: Artifact name
  path:
    required: true
    description: Source or destination
  if-no-files-found:
    default: error
    description: Missing upload is a failure
  retention-days:
    default: '7'
    description: Finite evidence retention
  compression-level:
    default: '0'
    description: Preserve tar bytes without extra compression work
  overwrite:
    default: 'false'
    description: Never replace existing artifacts
  include-hidden-files:
    default: 'false'
    description: Exclude hidden inputs
  archive:
    default: 'true'
    description: Standard official ZIP archive
  artifact-ids:
    description: Same-run artifact identity
  merge-multiple:
    default: 'true'
    description: Extract same artifact paths
  skip-decompress:
    default: 'false'
    description: Extract the official archive normally
  digest-mismatch:
    default: error
    description: Retain strict official digest gate
  github-token:
    description: Read-only current-repository token for the fixed prior input run; no repository secret
  repository:
    default: ${{ github.repository }}
    description: Current repository
  run-id:
    default: ${{ github.run_id }}
    description: Current run
outputs:
  artifact-id:
    description: Uploaded official artifact identity
  artifact-digest:
    description: Uploaded official archive digest
  download-path:
    description: Download destination
runs:
  using: docker
  image: Dockerfile
