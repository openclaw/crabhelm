name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crabhelm_test
          POSTGRES_USER: crabhelm
          POSTGRES_PASSWORD: crabhelm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crabhelm -d crabhelm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full check
        env:
          # Disposable service database enables the PostgreSQL integration tests.
          CRABHELM_TEST_POSTGRES_URL: postgresql://crabhelm:crabhelm_test@localhost:5432/crabhelm_test
        run: pnpm check

  build-native-appliance:
    name: Build reviewed native appliance once
    if: github.event_name == 'pull_request' && github.repository == 'openclaw/crabhelm' && github.event.pull_request.number == 37 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/emudhra-node-release'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      bundle-sha256: ${{ steps.build.outputs.bundle-sha256 }}
    steps:
      - name: Admit anonymous exact source and patched native tools
        id: native-tools
        env:
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = openclaw/crabhelm
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_ARCH" = X64
          test -z "$(ls -A "$GITHUB_WORKSPACE")"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin https://github.com/openclaw/crabhelm.git
          git fetch --no-tags origin "$REVIEWED_HEAD"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
          git cat-file -e 0a7149380cad4d3a52576417d2b953ff8e4c00ab:worker/bootstrap.ts
          tools="$RUNNER_TEMP/crabhelm37-patched-native-tools"
          mkdir "$tools"
          curl --fail --silent --show-error --location https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz --output "$tools/node.tar.xz"
          echo "1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce  $tools/node.tar.xz" | sha256sum --check
          mkdir "$tools/node"
          tar -xJf "$tools/node.tar.xz" --strip-components=1 -C "$tools/node"
          curl --fail --silent --show-error --location https://registry.npmjs.org/pnpm/-/pnpm-11.28.4.tgz --output "$tools/pnpm.tgz"
          echo "a4f318bc906d7fe28707f894e7bc86c0d134a8dcff5d5f37f1e18d7c1687cf6d  $tools/pnpm.tgz" | sha256sum --check
          mkdir "$tools/pnpm" "$tools/pnpm-bin"
          tar -xzf "$tools/pnpm.tgz" --strip-components=1 -C "$tools/pnpm"
          ln -s "$tools/pnpm/bin/pnpm.cjs" "$tools/pnpm-bin/pnpm"
          export PATH="$tools/node/bin:$tools/pnpm-bin:$PATH"
          test "$(node --version)" = v22.23.4
          test "$(pnpm --version)" = 11.28.4
          printf '%s\n' "$tools/node/bin" "$tools/pnpm-bin" >> "$GITHUB_PATH"
          node -e 'const c=require("node:crypto"),f=require("node:fs");console.log(JSON.stringify({nativeNode:process.version,arch:process.arch,executableSHA256:c.createHash("sha256").update(f.readFileSync(process.execPath)).digest("hex"),artifactTransport:"Supported local Docker action with independently admitted patched24.22.1; embedded host Node never executes an action in this job"}));'
      - name: Download exact same-run reviewed inputs
        uses: ./.github/actions/patched-artifact
        with:
          operation: download
          artifact-ids: '12476682095'
          github-token: ${{ github.token }}
          repository: openclaw/crabhelm
          run-id: '39894679029'
          path: ${{ runner.temp }}/appliance-inputs
          merge-multiple: true
          digest-mismatch: error
      - name: Install qualification dependencies
        run: pnpm install --frozen-lockfile
      - name: Build once through canonical profile and builder gates
        id: build
        env:
          CRABHELM_QUALIFICATION_INPUTS: ${{ runner.temp }}/appliance-inputs
          CRABHELM_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node --import tsx tests/native/appliance-qualification.mjs --build
      - name: Preserve exact built bytes for both lifecycle scenarios
        id: upload
        uses: ./.github/actions/patched-artifact
        with:
          operation: upload
          name: crabhelm37-built-${{ github.run_id }}
          path: |
            /github/runner_temp/crabhelm37-built/new-bundle.tgz
            /github/runner_temp/crabhelm37-built/released-predecessor.tgz
            /github/runner_temp/crabhelm37-built/build-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: false
      - name: Preserve build evidence
        if: always() && steps.native-tools.outcome == 'success'
        uses: ./.github/actions/patched-artifact
        with:
          operation: upload
          name: crabhelm37-native-build-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/crabhelm37-evidence
          if-no-files-found: error
          retention-days: 7

  qualify-native-appliance:
    name: Native appliance ${{ matrix.scenario }}
    needs: build-native-appliance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: [fresh, upgrade]
    steps:
      - name: Admit anonymous exact source and patched native tools
        id: native-tools
        env:
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = openclaw/crabhelm
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_ARCH" = X64
          test -z "$(ls -A "$GITHUB_WORKSPACE")"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin https://github.com/openclaw/crabhelm.git
          git fetch --no-tags origin "$REVIEWED_HEAD"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
          git cat-file -e 0a7149380cad4d3a52576417d2b953ff8e4c00ab:worker/bootstrap.ts
          tools="$RUNNER_TEMP/crabhelm37-patched-native-tools"
          mkdir "$tools"
          curl --fail --silent --show-error --location https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz --output "$tools/node.tar.xz"
          echo "1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce  $tools/node.tar.xz" | sha256sum --check
          mkdir "$tools/node"
          tar -xJf "$tools/node.tar.xz" --strip-components=1 -C "$tools/node"
          curl --fail --silent --show-error --location https://registry.npmjs.org/pnpm/-/pnpm-11.28.4.tgz --output "$tools/pnpm.tgz"
          echo "a4f318bc906d7fe28707f894e7bc86c0d134a8dcff5d5f37f1e18d7c1687cf6d  $tools/pnpm.tgz" | sha256sum --check
          mkdir "$tools/pnpm" "$tools/pnpm-bin"
          tar -xzf "$tools/pnpm.tgz" --strip-components=1 -C "$tools/pnpm"
          ln -s "$tools/pnpm/bin/pnpm.cjs" "$tools/pnpm-bin/pnpm"
          export PATH="$tools/node/bin:$tools/pnpm-bin:$PATH"
          test "$(node --version)" = v22.23.4
          test "$(pnpm --version)" = 11.28.4
          printf '%s\n' "$tools/node/bin" "$tools/pnpm-bin" >> "$GITHUB_PATH"
          node -e 'const c=require("node:crypto"),f=require("node:fs");console.log(JSON.stringify({nativeNode:process.version,arch:process.arch,executableSHA256:c.createHash("sha256").update(f.readFileSync(process.execPath)).digest("hex"),artifactTransport:"Supported local Docker action with independently admitted patched24.22.1; embedded host Node never executes an action in this job"}));'
      - name: Download exact same built appliance bytes
        uses: ./.github/actions/patched-artifact
        with:
          operation: download
          artifact-ids: ${{ needs.build-native-appliance.outputs.artifact-id }}
          path: ${{ runner.temp }}/built-appliance
          merge-multiple: true
          digest-mismatch: error
      - name: Install qualification dependencies
        run: pnpm install --frozen-lockfile
      - name: Qualify actual installation and genuine retained state
        env:
          CRABHELM_QUALIFICATION_SCENARIO: ${{ matrix.scenario }}
          CRABHELM_QUALIFICATION_BUILT: ${{ runner.temp }}/built-appliance
          CRABHELM_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CRABHELM_EXPECTED_BUNDLE_SHA256: ${{ needs.build-native-appliance.outputs.bundle-sha256 }}
        run: node --import tsx tests/native/appliance-qualification.mjs
      - name: Preserve bounded native evidence
        if: always() && steps.native-tools.outcome == 'success'
        uses: ./.github/actions/patched-artifact
        with:
          operation: upload
          name: crabhelm37-native-${{ matrix.scenario }}-${{ github.run_id }}
          path: ${{ runner.temp }}/crabhelm37-evidence
          if-no-files-found: error
          retention-days: 7
